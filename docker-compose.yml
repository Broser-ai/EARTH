services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: earth
      POSTGRES_USER: earth
      POSTGRES_PASSWORD: earth
    ports:
      - "5432:5432"
    volumes:
      - earth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earth -d earth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  earth_pgdata:
